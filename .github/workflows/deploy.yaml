name: Deploy to Production

on: workflow_dispatch

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: sutazeStrom

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.WEBSTROM_DEPLOY_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan server.strom.sk >> ~/.ssh/known_hosts

      - name: Deploy
        env:
          DOCKER_HOST: ssh://webstrom@server.strom.sk
        run: docker compose -f sutazeStrom/compose.yaml up --build --force-recreate --detach